/* =========================================================
   VitaLense — design system
   Abyss navy base · Coolant = measuring · Thermal = effort
   ========================================================= */
:root {
  --abyss: #050817; --deep: #0a1130; --deep2: #0e1840; --deep3: #15215a;
  --line: rgba(132, 160, 255, .13); --line2: rgba(132, 160, 255, .24);
  --text: #e8eeff; --muted: #9aa6d1; --dim: #66729f;
  --coolant: #3de0ff; --coolant-ink: #031b24; --plasma: #ff2e88; --ember: #ff7a2f; --solar: #ffd24a; --violet: #7a5cff;
  --good: #3cf0b4; --warn: #ffc24a; --bad: #ff4d6d;
  --heat: linear-gradient(100deg, #7a5cff 0%, #ff2e88 42%, #ff7a2f 76%, #ffd24a 100%);
  --r-xl: 28px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --sat: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
  --sab: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
  --font: 'Saira', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--abyss); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--abyss); color: var(--text);
  font: 400 16px/1.5 var(--font); font-stretch: 100%; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(70vmax 45vmax at -10% -12%, rgba(61, 224, 255, .09), transparent 62%),
    radial-gradient(55vmax 50vmax at 115% 28%, rgba(122, 92, 255, .11), transparent 60%),
    radial-gradient(60vmax 40vmax at 40% 125%, rgba(255, 46, 136, .07), transparent 60%);
}
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--coolant); outline-offset: 2px; border-radius: 6px; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 28px; height: 28px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* website chrome and desktop-only blocks are hidden in the app layout */
html:not(.desk) .desk-only, html:not(.desk) .topnav, html:not(.desk) .site-foot { display: none !important; }
html.desk .mob-only { display: none !important; }
html:not(.desk) .top.sub .kicker { display: none; }

#app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }
#view { padding: calc(var(--sat) + 12px) 18px calc(var(--sab) + 120px); }
#view.enter { animation: viewIn .38s cubic-bezier(.2, .7, .2, 1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- type ---------- */
.ttl { margin: 0; font-size: 30px; line-height: 1.08; font-weight: 700; font-stretch: 112%; letter-spacing: -.01em; }
.kicker { margin: 0 0 2px; font-size: 14px; color: var(--muted); font-stretch: 92%; }
h2.h2, .h2 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 650; font-stretch: 104%; }
.lbl { font-size: 13px; line-height: 1.3; font-weight: 560; font-stretch: 86%; color: var(--muted); letter-spacing: .01em; }
.display { font-weight: 760; font-stretch: 125%; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
p { margin: 0 0 10px; }
.lead { font-size: 15.5px; color: var(--muted); max-width: 62ch; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; margin-bottom: 14px; }
.top.sub { display: grid; grid-template-columns: 44px 1fr 44px; }
.top.sub .top-t { text-align: center; }
.top.sub .ttl { font-size: 21px; font-stretch: 106%; }
.ibtn { width: 44px; height: 44px; border-radius: 14px; display: inline-grid; place-items: center; background: rgba(20, 30, 80, .55); border: 1px solid var(--line); color: var(--text); padding: 0; }
.ibtn:active { transform: scale(.96); }
.ibtn.ghost { background: transparent; border-color: transparent; }

/* ---------- sections ---------- */
.sec { margin-top: 28px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-h a, .sec-h button.link { font-size: 14px; color: var(--coolant); background: none; border: 0; padding: 4px 0; font-weight: 560; }
.link { color: var(--coolant); background: none; border: 0; padding: 0; font-weight: 560; }

/* ---------- panels / rows ---------- */
.panel { position: relative; border-radius: var(--r-xl); padding: 18px; background: linear-gradient(180deg, rgba(25, 37, 98, .55), rgba(11, 18, 52, .62)); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
.panel.tight { padding: 14px; }
.panel.hot { border-color: rgba(255, 46, 136, .32); background: linear-gradient(180deg, rgba(60, 22, 70, .55), rgba(14, 16, 50, .66)); }
.rows { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); min-height: 64px; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; }
.row .rt { min-width: 0; }
.row .rt b { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
.row .rt span { display: block; font-size: 14px; color: var(--muted); line-height: 1.35; }
.row .tr { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.badge-ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: rgba(61, 224, 255, .09); color: var(--coolant); border: 1px solid rgba(61, 224, 255, .18); }
.badge-ic.hot { background: rgba(255, 46, 136, .1); color: #ff7ab2; border-color: rgba(255, 46, 136, .25); }
.badge-ic.sun { background: rgba(255, 210, 74, .1); color: var(--solar); border-color: rgba(255, 210, 74, .22); }
.badge-ic.good { background: rgba(60, 240, 180, .1); color: var(--good); border-color: rgba(60, 240, 180, .22); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 16px; border: 0; font-weight: 650; font-size: 16px; font-stretch: 104%; background: var(--coolant); color: var(--coolant-ink); box-shadow: 0 6px 24px rgba(61, 224, 255, .22); transition: transform .12s ease, box-shadow .2s ease; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.heat { background: var(--heat); color: #fff; box-shadow: 0 8px 28px rgba(255, 46, 136, .28); text-shadow: 0 1px 2px rgba(60, 0, 40, .35); }
.btn.ghost { background: rgba(20, 30, 80, .5); color: var(--text); border: 1px solid var(--line2); box-shadow: none; }
.btn.quiet { background: transparent; color: var(--coolant); box-shadow: none; padding: 0 10px; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14.5px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns > .btn { flex: 1; }

/* ---------- chips / segmented ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-left: -18px; margin-right: -18px; padding: 0 18px 4px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: rgba(14, 22, 64, .6); color: var(--text); font-size: 14.5px; font-weight: 520; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { border-color: var(--coolant); background: rgba(61, 224, 255, .14); color: #dffaff; box-shadow: inset 0 0 0 1px rgba(61, 224, 255, .35); }
.chip.hot.on { border-color: var(--plasma); background: rgba(255, 46, 136, .15); color: #ffe2ef; box-shadow: inset 0 0 0 1px rgba(255, 46, 136, .35); }
.chip .ic { width: 16px; height: 16px; }
.seg { display: flex; padding: 4px; gap: 4px; border-radius: 16px; background: rgba(9, 15, 46, .8); border: 1px solid var(--line); }
.seg button { flex: 1; min-height: 38px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14.5px; font-stretch: 96%; }
.seg button.on, .seg a.on { background: linear-gradient(180deg, rgba(61, 224, 255, .22), rgba(61, 224, 255, .1)); color: #e6fbff; box-shadow: inset 0 0 0 1px rgba(61, 224, 255, .4); }
.seg a { flex: 1; min-height: 38px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); font-weight: 600; font-size: 14.5px; font-stretch: 96%; text-align: center; }
.donut { width: 132px; height: 132px; flex: none; }
.donut circle { fill: none; stroke-width: 16; }
.legend { display: grid; gap: 8px; flex: 1; }
.legend div { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; font-size: 14.5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend b { font-variant-numeric: tabular-nums; }
.wdays { display: flex; gap: 6px; flex-wrap: wrap; }
.wdays .chip { min-width: 52px; justify-content: center; }
.sumlist .kv b { text-align: right; font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 1; padding: 6px 9px; border-radius: 8px; background: rgba(132, 160, 255, .1); color: #c3cdf2; font-weight: 560; font-stretch: 92%; }
.tag.cool { background: rgba(61, 224, 255, .12); color: #aef3ff; }
.tag.hot { background: rgba(255, 46, 136, .14); color: #ffb3d4; }
.tag.sun { background: rgba(255, 210, 74, .13); color: #ffe39a; }
.tag.good { background: rgba(60, 240, 180, .12); color: #a6ffe0; }
.tag.bad { background: rgba(255, 77, 109, .14); color: #ffb0bf; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- forms ---------- */
.field { display: grid; gap: 7px; margin-bottom: 16px; }
.field > label, .field > .lbl { font-size: 14px; color: var(--muted); font-weight: 540; }
.inp { width: 100%; min-height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line2); background: rgba(6, 11, 36, .75); color: var(--text); font-size: 17px; font-variant-numeric: tabular-nums; }
.inp:focus { outline: none; border-color: var(--coolant); box-shadow: 0 0 0 3px rgba(61, 224, 255, .18); }
textarea.inp { min-height: 120px; padding: 12px 14px; font-size: 14px; line-height: 1.4; }
.inp-u { position: relative; }
.inp-u .inp { padding-right: 48px; }
.inp-u i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--dim); font-size: 14px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stepper { display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; border: 1px solid var(--line2); border-radius: 14px; background: rgba(6, 11, 36, .75); overflow: hidden; }
.stepper button { height: 50px; border: 0; background: transparent; color: var(--coolant); display: grid; place-items: center; }
.stepper output { text-align: center; font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
.rng { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 4px 0; --p: 50%; }
.rng::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--coolant) var(--p), rgba(132, 160, 255, .18) var(--p)); }
.rng::-moz-range-track { height: 6px; border-radius: 6px; background: rgba(132, 160, 255, .18); }
.rng::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--coolant); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #e9fbff; border: 4px solid var(--coolant); box-shadow: 0 0 0 6px rgba(61, 224, 255, .15), 0 4px 14px rgba(0, 0, 0, .4); }
.rng::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #e9fbff; border: 4px solid var(--coolant); box-shadow: 0 0 0 6px rgba(61, 224, 255, .15); }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: rgba(132, 160, 255, .2); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #dfe6ff; transition: transform .2s; }
.switch input:checked + span { background: var(--coolant); }
.switch input:checked + span::after { transform: translateX(20px); background: #fff; }
.opt { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line2); background: rgba(10, 17, 52, .65); margin-bottom: 10px; color: var(--text); }
.opt b { display: block; font-weight: 620; }
.opt span { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; }
.opt.on { border-color: var(--coolant); background: rgba(61, 224, 255, .1); box-shadow: inset 0 0 0 1px rgba(61, 224, 255, .3); }
.opt .tick { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; color: var(--coolant-ink); }
.opt.on .tick { background: var(--coolant); border-color: var(--coolant); }
.opt .tick .ic { width: 15px; height: 15px; stroke-width: 2.6; }

/* ---------- bars / rings ---------- */
.bar { height: 8px; border-radius: 8px; background: rgba(132, 160, 255, .14); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 8px; background: var(--coolant); transition: width .6s cubic-bezier(.2, .7, .2, 1); }
.bar.heat i { background: var(--heat); }
.bar.good i { background: var(--good); }
.bar.warn i { background: var(--warn); }
.bar.bad i { background: var(--bad); }
.ring .ring-bg { fill: none; stroke: rgba(132, 160, 255, .14); }
.ring .ring-fg { fill: none; stroke: var(--coolant); stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.2, .7, .2, 1); }
.ring.heat .ring-fg { stroke: url(#gHeat); }
.ring.good .ring-fg { stroke: var(--good); }

/* ---------- Body Twin ---------- */
svg.tw { display: block; width: 100%; height: auto; overflow: visible; }
.tw .floor { stroke: url(#gFloor); stroke-width: 1.4; }
.tw .floorglow { fill: url(#gFloorGlow); }
.tw path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tw .cap { stroke: rgba(120, 165, 255, .36); }
.tw .cap.L-far { stroke: rgba(100, 130, 240, .18); }
.tw .core { stroke: #d6e3ff; }
.tw .core.L-far { stroke: rgba(150, 175, 255, .42); }
.tw .cap.hot { stroke: rgba(255, 60, 130, .58); }
.tw .cap.hot.L-far { stroke: rgba(255, 60, 130, .3); }
.tw .core.hot { stroke: #ffc27a; }
.tw .core.hot.L-far { stroke: rgba(255, 194, 122, .55); }
.tw .glow { stroke: rgba(255, 46, 136, .2); stroke-width: 22; animation: pulse 1.8s ease-in-out infinite; }
.tw .glow.L-far { stroke: rgba(255, 46, 136, .1); }
.tw .head { fill: rgba(120, 165, 255, .26); stroke: #d6e3ff; stroke-width: 1.6; }
.tw .hotdot { fill: rgba(255, 46, 136, .45); stroke: #ffc27a; stroke-width: 1.2; animation: pulse 1.8s ease-in-out infinite; }
.tw .prop { fill: rgba(70, 90, 170, .22); stroke: rgba(130, 155, 235, .45); stroke-width: 1.2; }
.tw .prop-l { stroke: rgba(130, 155, 235, .5); stroke-linecap: round; fill: none; }
.tw .prop-h { stroke: rgba(130, 155, 235, .28); stroke-width: 1; }
.tw .cable { stroke: rgba(170, 190, 255, .55); stroke-width: 1; stroke-dasharray: 3 2; }
.tw .plate { fill: rgba(20, 28, 70, .9); stroke: #8fa6ff; stroke-width: 1.6; }
.tw .hub { fill: #c9d6ff; }
.tw .bottle { fill: rgba(61, 224, 255, .25); stroke: var(--coolant); stroke-width: 1.2; }
.tw .scanline { fill: url(#gScan); animation: scan 4.2s cubic-bezier(.45, 0, .55, 1) infinite; }
.tw.front .core { stroke: #d6e3ff; }
@keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes scan { 0% { transform: translateY(-30px); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(196px); opacity: 0; } }

/* ---------- hero (home) ---------- */
.hero { position: relative; border-radius: 32px; padding: 14px 14px 16px; background: radial-gradient(120% 80% at 50% 0%, rgba(61, 224, 255, .12), transparent 60%), linear-gradient(180deg, rgba(18, 28, 84, .7), rgba(8, 13, 40, .8)); border: 1px solid var(--line); overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(132, 160, 255, .16) 1px, transparent 1.2px); background-size: 14px 14px; mask-image: radial-gradient(70% 60% at 50% 45%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000 30%, transparent 75%); pointer-events: none; }
.hero-grid { position: relative; display: grid; grid-template-columns: 1fr 1.3fr 1fr; align-items: center; gap: 4px; }
.hero-twin { position: relative; }
.hero-twin svg.tw { max-width: 190px; margin: 0 auto; }
.tw.sm { max-width: 150px; margin: 0 auto; }
.opt b .tag { display: inline-flex; vertical-align: 2px; }
.vcol { display: grid; gap: 22px; }
.vital { display: block; text-align: left; padding: 6px 4px; border: 0; background: none; color: inherit; position: relative; }
.vcol.r .vital { text-align: right; }
.vital .v { display: block; font-size: 27px; font-weight: 760; font-stretch: 122%; line-height: 1.02; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.vital .v small { font-size: 14px; font-weight: 600; color: var(--muted); font-stretch: 100%; margin-left: 2px; }
.vital .k { display: block; font-size: 13px; color: var(--muted); font-stretch: 88%; margin-top: 3px; }
.vital .s { display: inline-block; font-size: 12px; margin-top: 4px; padding: 2px 7px; border-radius: 6px; font-weight: 600; font-stretch: 90%; }
.vital .v.empty { color: var(--coolant); height: 27px; display: flex; align-items: center; }
.vcol.r .vital .v.empty { justify-content: flex-end; }
.vital .v.empty .ic { width: 24px; height: 24px; padding: 3px; border-radius: 8px; border: 1px dashed rgba(61, 224, 255, .5); }
.s.good { background: rgba(60, 240, 180, .12); color: #9cffde; }
.s.warn { background: rgba(255, 194, 74, .13); color: #ffe08f; }
.s.bad { background: rgba(255, 77, 109, .14); color: #ffb0bf; }
.s.cool { background: rgba(61, 224, 255, .12); color: #aef3ff; }
.hero-foot { position: relative; display: flex; align-items: center; gap: 12px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.hero-foot .vs { flex: 1; min-width: 0; }
.hero-foot .vs b { font-size: 15px; font-weight: 640; }
.hero-foot .vs .bar { margin-top: 7px; }
.score-n { font-size: 34px; font-weight: 780; font-stretch: 125%; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- today rows ---------- */
.today .row .badge-ic .ic { width: 21px; height: 21px; }
.water-mini { display: flex; align-items: center; gap: 10px; }
.water-mini .bar { width: 64px; }

/* ---------- tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: grid; justify-items: start; gap: 10px; padding: 14px 12px; border-radius: 18px; border: 1px solid var(--line); background: rgba(12, 20, 60, .55); color: var(--text); text-align: left; min-height: 96px; }
.tile b { font-size: 14.5px; font-weight: 600; line-height: 1.2; }
.tile .ic { color: var(--coolant); }
.tile.hot .ic { color: #ff7ab2; }
.tile.sun .ic { color: var(--solar); }

/* ---------- horizontal cards (routines) ---------- */
.hscroll { display: flex; gap: 12px; overflow-x: auto; margin-left: -18px; margin-right: -18px; padding: 2px 18px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.rcard-h { flex: none; width: 168px; scroll-snap-align: start; border-radius: 22px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(22, 32, 92, .6), rgba(10, 16, 48, .7)); padding: 10px 12px 14px; text-align: left; color: var(--text); }
.rcard-h .tw { margin: -4px auto 2px; width: 120px; }
.rcard-h b { display: block; font-size: 15px; line-height: 1.25; font-weight: 620; }
.rcard-h span { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }

/* ---------- exercise cards ---------- */
.xgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.xcard { position: relative; border-radius: 20px; border: 1px solid var(--line); background: rgba(12, 20, 60, .5); padding: 8px 10px 12px; text-align: left; color: var(--text); }
.xcard .tw { width: 100%; max-width: 150px; margin: 0 auto; }
.xcard b { display: block; font-size: 14.5px; font-weight: 610; line-height: 1.25; margin-top: 2px; }
.xcard span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.xcard .lv { position: absolute; top: 9px; right: 10px; display: flex; gap: 3px; }
.lv i { width: 5px; height: 12px; border-radius: 2px; background: rgba(132, 160, 255, .2); }
.lv i.on { background: var(--ember); }
.xrow { display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: inherit; }
.xrow .tw { width: 76px; }
.xrow b { display: block; font-weight: 600; line-height: 1.25; }
.xrow span { display: block; font-size: 13.5px; color: var(--muted); }
.xrow .rx { font-size: 14px; color: #ffd6a6; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- body map ---------- */
.bm-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: start; }
.bodymap { width: 100%; max-width: 210px; display: block; margin: 0 auto; }
.bm-sil { stroke: rgba(110, 140, 240, .2); stroke-linecap: round; fill: none; }
.bm-sil-f { fill: rgba(110, 140, 240, .2); }
.bm-r { fill: rgba(61, 224, 255, .1); stroke: rgba(61, 224, 255, .55); stroke-width: 1; cursor: pointer; transition: fill .2s, stroke .2s; }
.bm-r:hover { fill: rgba(61, 224, 255, .22); }
.bodymap.has-sel .bm-r { fill: rgba(61, 224, 255, .04); stroke: rgba(61, 224, 255, .22); }
.bodymap .bm-r.on { fill: rgba(255, 46, 136, .45); stroke: #ffc27a; stroke-width: 1.4; }
.bm-scan { fill: url(#gScan); animation: bmscan 5s linear infinite; pointer-events: none; }
@keyframes bmscan { 0% { transform: translateY(-30px); } 100% { transform: translateY(380px); } }
.bm-cap { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
.mdiag .ml line { stroke: rgba(61, 224, 255, .35); stroke-width: 2; stroke-dasharray: 4 3; }
.mdiag .ml circle { fill: rgba(61, 224, 255, .5); }
.mdiag .ml.on line { stroke: var(--coolant); stroke-width: 3.5; stroke-dasharray: none; filter: drop-shadow(0 0 4px rgba(61, 224, 255, .9)); }
.mdiag .ml.on circle { fill: #fff; }
.mgrid { display: grid; grid-template-columns: 116px 1fr; gap: 14px; align-items: start; }
.mgrid .mdiag { position: sticky; top: calc(var(--sat) + 10px); max-width: 116px; }
.mfields .field { margin-bottom: 12px; }
.mfields .inp { min-height: 46px; }
.gauge .gt { fill: var(--muted); font-size: 11px; font-family: var(--font); font-weight: 600; }
.gauge .needle { transform-box: view-box; }

/* ---------- gauges ---------- */
.gauge { position: relative; max-width: 300px; margin: 0 auto; }
.gauge svg { width: 100%; display: block; overflow: visible; }
.gauge .needle { transform-origin: 150px 150px; transition: transform 1.1s cubic-bezier(.2, .8, .2, 1); }
.gauge .gv { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.gauge .gv .display { font-size: 52px; }
.zone-list { display: grid; gap: 6px; margin-top: 14px; }
.zone { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); padding: 3px 0; }
.zone i { width: 10px; height: 10px; border-radius: 3px; }
.zone.on { color: var(--text); font-weight: 600; }
.lin { position: relative; height: 12px; border-radius: 12px; display: flex; overflow: hidden; }
.lin span { height: 100%; }
.lin-wrap { position: relative; padding-top: 22px; }
.lin-mark { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; }
.lin-mark::after { content: ""; position: absolute; left: 50%; top: 17px; width: 2px; height: 18px; background: #fff; transform: translateX(-50%); border-radius: 2px; box-shadow: 0 0 8px rgba(255, 255, 255, .7); }
.lin-scale { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-top: 6px; font-variant-numeric: tabular-nums; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats.two { grid-template-columns: 1fr 1fr; }
.stat { border-radius: 16px; padding: 12px; background: rgba(10, 17, 52, .6); border: 1px solid var(--line); }
.stat .v { font-size: 22px; font-weight: 720; font-stretch: 116%; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; color: var(--muted); font-weight: 560; font-stretch: 100%; }
.stat .k { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.25; }

/* ---------- insight list ---------- */
.ins { display: grid; grid-template-columns: 10px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ins:last-child { border-bottom: 0; }
.ins i { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.ins b { display: block; font-weight: 620; }
.ins span { display: block; color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.dot-good { background: var(--good); box-shadow: 0 0 10px rgba(60, 240, 180, .6); }
.dot-warn { background: var(--warn); box-shadow: 0 0 10px rgba(255, 194, 74, .6); }
.dot-bad { background: var(--bad); box-shadow: 0 0 10px rgba(255, 77, 109, .6); }
.dot-cool { background: var(--coolant); box-shadow: 0 0 10px rgba(61, 224, 255, .6); }

/* ---------- bio age ---------- */
.qprog { display: flex; gap: 4px; margin: 4px 0 18px; }
.qprog i { flex: 1; height: 4px; border-radius: 4px; background: rgba(132, 160, 255, .16); }
.qprog i.on { background: var(--coolant); }
.qcard h2 { font-size: 23px; font-weight: 680; font-stretch: 106%; line-height: 1.2; margin: 0 0 6px; }
.qcard .why { color: var(--muted); font-size: 14.5px; margin-bottom: 16px; }
.factor { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.factor:last-child { border-bottom: 0; }
.fbar { position: relative; height: 10px; }
.fbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line2); }
.fbar i { position: absolute; top: 0; height: 10px; border-radius: 3px; }
.fbar i.minus { right: 50%; background: var(--good); }
.fbar i.plus { left: 50%; background: var(--heat); }
.fval { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bio-big { text-align: center; padding: 8px 0 4px; }
.bio-big .display { font-size: 72px; }
.bio-big .delta { font-size: 17px; font-weight: 640; margin-top: 8px; }
.pulse-tap { width: 160px; height: 160px; border-radius: 50%; margin: 10px auto; display: grid; place-items: center; border: 1px solid rgba(255, 46, 136, .4); background: radial-gradient(circle, rgba(255, 46, 136, .22), rgba(255, 46, 136, .04) 70%); color: #ffd1e3; font-weight: 650; font-size: 17px; text-align: center; }
.pulse-tap.beat { animation: beat .25s ease-out; }
@keyframes beat { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
.timer-big { font-size: 64px; text-align: center; margin: 8px 0; }

/* ---------- photos ---------- */
.ph { position: relative; overflow: hidden; display: grid; place-items: center; color: #fff; isolation: isolate; }
.ph > .ic { filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .3)); }
.pimg { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .45s ease; }
.pimg.ok { opacity: 1; }
.pimg.fail { display: none; }
.pcredit { margin: 6px 2px 0; font-size: 11.5px; color: var(--dim); line-height: 1.4; }
.pcredit a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

/* ---------- recipes & drinks ---------- */
.ftile { width: 60px; height: 60px; border-radius: 16px; flex: none; }
.ftile::after { content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); pointer-events: none; }
.ftile .ic { width: 28px; height: 28px; stroke-width: 1.6; }
.ftile.big { width: 76px; height: 76px; border-radius: 22px; }
.ftile.big .ic { width: 38px; height: 38px; }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rcard { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 0; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(22, 32, 92, .55), rgba(10, 16, 48, .72)); color: var(--text); text-align: left; overflow: hidden; transition: transform .18s ease, border-color .2s ease, box-shadow .2s ease; }
.rcard:active { transform: scale(.985); }
.rc-ph { width: 100%; aspect-ratio: 4 / 3; }
.rc-ph .ic { width: 40px; height: 40px; stroke-width: 1.5; }
.rc-ph::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%; z-index: 1; background: linear-gradient(180deg, rgba(5, 8, 23, .38), transparent); pointer-events: none; }
.rc-ph .glass { max-width: 64px; }
.rc-t { display: block; padding: 10px 12px 12px; min-width: 0; }
.rc-t b { display: block; font-size: 14.5px; font-weight: 620; line-height: 1.25; }
.rc-t span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.rcard .kc { position: absolute; top: 8px; right: 8px; z-index: 3; padding: 4px 8px; border-radius: 10px; background: rgba(5, 8, 23, .7); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 13px; font-weight: 680; line-height: 1.2; font-variant-numeric: tabular-nums; color: #fff; }
.rcard .kc small { font-size: 11px; font-weight: 520; color: #c9d3ff; margin-left: 3px; }
.rc-slot { position: absolute; left: 8px; top: 8px; z-index: 3; padding: 4px 8px; border-radius: 10px; background: rgba(61, 224, 255, .9); color: var(--coolant-ink); font-size: 12px; font-weight: 700; font-stretch: 92%; line-height: 1.2; }
.rc-slot.soft { background: rgba(5, 8, 23, .7); color: #dfe6ff; font-weight: 620; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.rscroll { display: flex; gap: 12px; overflow-x: auto; margin-left: -18px; margin-right: -18px; padding: 2px 18px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.rscroll::-webkit-scrollbar { display: none; }
.rscroll .rcard { flex: none; width: 200px; scroll-snap-align: start; }
.rhero { margin: 0; width: 100%; aspect-ratio: 16 / 10; border-radius: 20px; }
.rhero > .ic { width: 64px; height: 64px; stroke-width: 1.4; }
.rhero::after { content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); pointer-events: none; }
.rhero.drink .glass { max-width: 110px; }
.macro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.macro div { text-align: center; padding: 10px 4px; border-radius: 14px; background: rgba(10, 17, 52, .6); border: 1px solid var(--line); }
.macro b { display: block; font-size: 19px; font-weight: 720; font-stretch: 112%; font-variant-numeric: tabular-nums; }
.macro span { font-size: 12px; color: var(--muted); }
.ing { list-style: none; padding: 0; margin: 0; }
.ing li { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.ing li b { font-weight: 640; color: #bff4ff; font-variant-numeric: tabular-nums; }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; }
.steps li { counter-increment: s; position: relative; padding: 0 0 14px 40px; font-size: 15px; line-height: 1.5; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: -1px; width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: rgba(61, 224, 255, .12); color: var(--coolant); }
.glass { width: 100%; max-width: 92px; display: block; margin: 0 auto; }
.glass .liq { animation: slosh 4s ease-in-out infinite; transform-origin: 50% 100%; }
.glass .bub { animation: bub 3.2s linear infinite; }
@keyframes slosh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-12px); } }
@keyframes bub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-46px); opacity: 0; } }
.note { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(61, 224, 255, .07); border: 1px solid rgba(61, 224, 255, .18); font-size: 14px; color: #c9f6ff; line-height: 1.45; }
.note.warn { background: rgba(255, 194, 74, .07); border-color: rgba(255, 194, 74, .22); color: #ffe7b0; }
.note .ic { width: 20px; height: 20px; margin-top: 1px; }

/* ---------- meal plan ---------- */
.days { display: flex; gap: 6px; overflow-x: auto; margin-left: -18px; margin-right: -18px; margin-bottom: 14px; padding: 0 18px 4px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; width: 52px; padding: 8px 0; border-radius: 14px; border: 1px solid var(--line); background: rgba(10, 17, 52, .6); text-align: center; color: var(--muted); }
.day b { display: block; font-size: 15px; color: var(--text); font-weight: 640; }
.day span { font-size: 11.5px; }
.day.on { border-color: var(--coolant); background: rgba(61, 224, 255, .13); color: #c9f6ff; }
.day.today b::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--plasma); margin: 3px auto 0; }
.meal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.m-open { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; align-items: center; min-width: 0; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.m-t { display: block; min-width: 0; }
.meal .slot { display: block; font-size: 12.5px; color: var(--coolant); font-weight: 600; font-stretch: 90%; }
.meal b { display: block; font-weight: 610; line-height: 1.25; }
.m-t > span:last-child { display: block; font-size: 13px; color: var(--muted); }
.meal .acts { display: flex; gap: 6px; }
.meal .acts .ibtn { width: 38px; height: 38px; border-radius: 12px; }
.totals { display: grid; gap: 10px; }
.tline { display: grid; grid-template-columns: 86px 1fr 92px; gap: 10px; align-items: center; font-size: 14px; }
.tline span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- workout plan ---------- */
.wday { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: inherit; }
.wday .d { font-weight: 700; font-stretch: 112%; color: var(--muted); }
.wday.today .d { color: var(--plasma); }
.wday b { display: block; font-weight: 620; }
.wday span { display: block; font-size: 13.5px; color: var(--muted); }
.wday.rest b { color: var(--muted); font-weight: 520; }

/* ---------- grocery ---------- */
.gitem { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: inherit; font-size: 15px; }
.gitem .cb { width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid var(--line2); display: grid; place-items: center; color: var(--coolant-ink); }
.gitem.done .cb { background: var(--coolant); border-color: var(--coolant); }
.gitem.done .gn { color: var(--dim); text-decoration: line-through; }
.gitem .gq { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

/* ---------- charts ---------- */
.chart { width: 100%; display: block; overflow: visible; }
.chart .grid line { stroke: rgba(132, 160, 255, .1); }
.chart .axis text { fill: var(--dim); font-size: 11px; font-family: var(--font); }
.chart .ln { fill: none; stroke: var(--coolant); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .ar { fill: url(#gArea); }
.chart .pt { fill: var(--abyss); stroke: var(--coolant); stroke-width: 2; }
.chart .pt.last { fill: var(--coolant); }
.chart .lbl-v { fill: var(--text); font-size: 12px; font-weight: 650; font-family: var(--font); }
.chart .goal { stroke: var(--good); stroke-dasharray: 4 4; stroke-width: 1.2; }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(2, 4, 14, .62); opacity: 0; transition: opacity .3s ease; touch-action: none; }
.sheet { position: relative; width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh; border-radius: 28px 28px 0 0; background: linear-gradient(180deg, #111b4a, #0a1131 30%); border: 1px solid var(--line2); border-bottom: 0; transform: translateY(100%); transition: transform .34s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; box-shadow: 0 -20px 60px rgba(0, 0, 0, .5); }
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap.open .sheet-scrim { opacity: 1; }
.grab { width: 40px; height: 5px; border-radius: 5px; background: rgba(132, 160, 255, .3); margin: 9px auto 0; flex: none; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 8px 18px calc(var(--sab) + 22px); -webkit-overflow-scrolling: touch; }
.sheet-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: sticky; top: -8px; padding: 10px 0 12px; margin-top: -8px; background: linear-gradient(180deg, #111b4a 75%, rgba(17, 27, 74, 0)); z-index: 2; }
.sh-t { margin: 4px 0 0; font-size: 22px; font-weight: 700; font-stretch: 108%; line-height: 1.15; }
.sh-s { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.sheet-wrap.full { align-items: stretch; }
.sheet-wrap.full .sheet { max-height: none; height: 100%; border-radius: 0; border: 0; transform: translateY(24px); opacity: 0; transition: transform .3s ease, opacity .3s ease; background: radial-gradient(120% 60% at 50% 0%, rgba(61, 224, 255, .1), transparent 60%), var(--abyss); }
.sheet-wrap.full.open .sheet { transform: none; opacity: 1; }
.sheet-wrap.full .sheet-body { padding: calc(var(--sat) + 10px) 18px calc(var(--sab) + 20px); height: 100%; }

/* ---------- player ---------- */
.player { display: flex; flex-direction: column; min-height: 100%; }
.pl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pl-prog { display: flex; gap: 3px; flex: 1; }
.pl-prog i { flex: 1; height: 4px; border-radius: 3px; background: rgba(132, 160, 255, .18); }
.pl-prog i.done { background: var(--coolant); }
.pl-prog i.cur { background: var(--heat); }
.pl-main { flex: 1; display: flex; flex-direction: column; }
.pl-stage { position: relative; flex: 1; display: grid; place-items: center; min-height: 260px; }
.pl-stage .tw { max-width: 340px; }
.pl-phase { text-align: center; font-size: 14px; font-weight: 640; font-stretch: 92%; color: var(--muted); }
.pl-phase.work { color: #ffb3d4; }
.pl-phase.rest { color: var(--coolant); }
.pl-name { text-align: center; font-size: 26px; font-weight: 720; font-stretch: 110%; line-height: 1.15; margin: 4px 0 2px; }
.pl-sub { text-align: center; color: var(--muted); font-size: 15px; }
.pl-clock { position: relative; width: 132px; height: 132px; margin: 14px auto 6px; }
.pl-clock .ring { position: absolute; inset: 0; }
.pl-clock .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; font-weight: 760; font-stretch: 122%; font-variant-numeric: tabular-nums; }
.pl-ctrl { display: grid; grid-template-columns: 56px 1fr 56px; gap: 14px; align-items: center; margin-top: 10px; }
.pl-ctrl .ibtn { width: 56px; height: 56px; border-radius: 18px; }
.pl-next { display: flex; align-items: center; gap: 10px; justify-content: center; color: var(--muted); font-size: 14px; margin-top: 12px; min-height: 22px; }
.pl-cue { text-align: center; color: #cfd8ff; font-size: 14.5px; max-width: 34ch; margin: 6px auto 0; min-height: 42px; }
.done-wrap { text-align: center; padding-top: 30px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; }

/* ---------- onboarding ---------- */
.onb { display: flex; flex-direction: column; min-height: calc(100dvh - var(--sat) - var(--sab) - 40px); }
.onb-hero { text-align: center; padding-top: 6px; }
.onb-hero .tw { max-width: 230px; margin: 0 auto; }
.brand { font-size: 40px; font-weight: 780; font-stretch: 125%; letter-spacing: -.02em; line-height: 1; margin: 8px 0 10px; }
.brand span { background: var(--heat); -webkit-background-clip: text; background-clip: text; color: transparent; }
.onb .lead { margin: 0 auto 18px; text-align: center; }
.onb-foot { margin-top: auto; padding-top: 18px; }
.steps-dots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 18px; }
.steps-dots i { width: 22px; height: 4px; border-radius: 4px; background: rgba(132, 160, 255, .2); }
.steps-dots i.on { background: var(--coolant); }

/* ---------- dock ---------- */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sab) + 10px); z-index: 30; width: min(456px, calc(100% - 20px)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 7px 6px; border-radius: 26px; background: rgba(9, 15, 46, .78); border: 1px solid var(--line2); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
.dock a { display: grid; justify-items: center; gap: 3px; padding: 6px 0 4px; color: var(--dim); font-size: 11.5px; font-weight: 600; font-stretch: 92%; border-radius: 16px; }
.dock a.on { color: #e9fbff; }
.dock a.on .ic { color: var(--coolant); filter: drop-shadow(0 0 6px rgba(61, 224, 255, .6)); }
.dock .core-orb { width: 52px; height: 52px; margin-top: -24px; border-radius: 50%; display: grid; place-items: center; background: var(--heat); color: #fff; box-shadow: 0 8px 26px rgba(255, 46, 136, .4), inset 0 0 0 1px rgba(255, 255, 255, .25); }
.dock .core-orb .ic { width: 26px; height: 26px; stroke-width: 2; }
.dock a.core.on .core-orb { box-shadow: 0 0 0 3px rgba(255, 255, 255, .2), 0 8px 30px rgba(255, 46, 136, .55); }
.dock a.core.on .ic { color: #fff; filter: none; }
.dock .core-orb.call { animation: orb 2.4s ease-in-out infinite; }
@keyframes orb { 0%, 100% { box-shadow: 0 8px 26px rgba(255, 46, 136, .4), 0 0 0 0 rgba(255, 46, 136, .35); } 50% { box-shadow: 0 8px 26px rgba(255, 46, 136, .4), 0 0 0 10px rgba(255, 46, 136, 0); } }
body.locked .dock, body.playing .dock, body.onboarding .dock { display: none; }

/* ---------- toasts ---------- */
#toasts { position: fixed; left: 0; right: 0; top: calc(var(--sat) + 10px); z-index: 90; display: grid; justify-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { max-width: 440px; padding: 12px 16px; border-radius: 16px; background: rgba(14, 22, 64, .96); border: 1px solid var(--line2); color: var(--text); font-size: 14.5px; box-shadow: 0 12px 30px rgba(0, 0, 0, .45); transform: translateY(-14px); opacity: 0; transition: transform .3s ease, opacity .3s ease; }
.toast.in { transform: none; opacity: 1; }
.toast.badge { border-color: rgba(255, 210, 74, .45); background: linear-gradient(100deg, rgba(60, 30, 80, .97), rgba(20, 22, 64, .97)); }
.toast.badge b { color: var(--solar); }

/* ---------- company branding ---------- */
.co-logo { display: block; max-width: 100%; height: auto; }
.co-sign { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 26px auto 0; }
.co-sign .lbl, .sf-co .lbl, .oa-co .lbl { font-size: 11px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.onb-foot .co-sign { margin-top: 18px; }
.co-about { display: grid; justify-items: center; text-align: center; padding: 22px 18px 18px; }
.co-about .co-logo { width: auto; max-height: 84px; }

/* ---------- layout helpers (single column in the app layout) ---------- */
.lay, .col { min-width: 0; }

/* ---------- misc ---------- */
.empty { text-align: center; padding: 26px 10px; color: var(--muted); }
.empty .ic { width: 34px; height: 34px; color: var(--dim); margin-bottom: 8px; }
.divider { height: 1px; background: var(--line); margin: 18px 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.kv span:first-child { color: var(--muted); }
.kv:last-child { border-bottom: 0; }
.spacer { height: 16px; }
.center { text-align: center; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mb16 { margin-bottom: 16px; }
.flex { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.breath-orb { width: 230px; height: 230px; margin: 30px auto 18px; border-radius: 50%; position: relative; display: grid; place-items: center; }
.breath-orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(61, 224, 255, .55), rgba(122, 92, 255, .25) 55%, transparent 72%); transform: scale(var(--s, .55)); transition: transform var(--d, 4s) cubic-bezier(.45, 0, .55, 1); }
.breath-orb::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid rgba(61, 224, 255, .25); }
.breath-orb b { position: relative; font-size: 22px; font-weight: 680; font-stretch: 108%; }
.water-tank { width: 150px; height: 210px; margin: 10px auto 6px; position: relative; border-radius: 30px 30px 40px 40px; border: 2px solid rgba(61, 224, 255, .45); overflow: hidden; background: rgba(6, 11, 36, .7); }
.water-tank .lvl { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(61, 224, 255, .75), rgba(40, 110, 255, .55)); transition: height .8s cubic-bezier(.2, .7, .2, 1); }
.water-tank .lvl::before { content: ""; position: absolute; left: -50%; top: -10px; width: 200%; height: 20px; background: radial-gradient(12px 8px at 12px 10px, rgba(61, 224, 255, .75) 98%, transparent) 0 0 / 24px 20px repeat-x; animation: wave 2.4s linear infinite; }
@keyframes wave { from { transform: translateX(0); } to { transform: translateX(24px); } }
.water-tank .wv { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 720; font-size: 26px; font-stretch: 118%; text-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
.water-tank .wv small { display: block; font-size: 13px; font-weight: 560; color: #d8f8ff; font-stretch: 100%; }
.wbars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 110px; }
.wbars div { display: grid; gap: 5px; justify-items: center; height: 100%; align-content: end; }
.wbars i { width: 100%; border-radius: 7px 7px 3px 3px; background: rgba(61, 224, 255, .3); min-height: 4px; }
.wbars i.hit { background: var(--coolant); }
.wbars span { font-size: 11.5px; color: var(--dim); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bdg { border-radius: 18px; padding: 14px 8px; text-align: center; border: 1px solid var(--line); background: rgba(10, 17, 52, .6); }
.bdg .hex { width: 54px; height: 54px; margin: 0 auto 8px; display: grid; place-items: center; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); background: rgba(132, 160, 255, .12); color: var(--dim); }
.bdg.on .hex { background: var(--heat); color: #fff; }
.bdg b { display: block; font-size: 13.5px; font-weight: 620; line-height: 1.2; }
.bdg span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.bdg:not(.on) b { color: var(--muted); }
.legal { font-size: 12.5px; color: var(--dim); line-height: 1.5; }

@media (min-width: 520px) {
  #view { padding-left: 22px; padding-right: 22px; }
}
@media (max-width: 360px) {
  .ttl { font-size: 26px; }
  .vital .v { font-size: 23px; }
  .tiles { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .tw .scanline, .bm-scan { display: none; }
}

/* =========================================================
   VitaLense — website layout
   Applies to browsers at least 768 px wide (and 500 px tall) via
   html.desk, set by Site.init(). Phones and the native apps keep
   the app layout with the bottom dock.
   ========================================================= */

/* ---------- shared brand pieces (also used by the onboarding art) ---------- */
.tn-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); flex: none; }
.tn-word { font-size: 22px; font-weight: 760; font-stretch: 122%; letter-spacing: -.015em; line-height: 1; }
.tn-word b { font-weight: inherit; background: var(--heat); -webkit-background-clip: text; background-clip: text; color: transparent; }
.vl-mark { display: block; flex: none; filter: drop-shadow(0 4px 14px rgba(255, 46, 136, .25)); }

html.desk { scrollbar-gutter: stable; scrollbar-color: rgba(132, 160, 255, .28) transparent; }
.desk #app { max-width: none; display: flex; flex-direction: column; min-height: 100vh; }
.desk #view { flex: 1 0 auto; width: 100%; max-width: 1280px; margin: 0 auto; padding: 36px 40px 72px; }
.desk .dock { display: none; }
.desk #toasts { top: 84px; }

/* ---------- top navigation ---------- */
.desk .topnav { position: sticky; top: 0; z-index: 40; background: rgba(5, 8, 23, .74); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); border-bottom: 1px solid var(--line); }
.desk .tn-in { max-width: 1280px; height: 72px; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; gap: 24px; }
.desk .tn-links { display: flex; gap: 4px; margin: 0 auto; padding: 4px; border-radius: 16px; background: rgba(14, 22, 64, .55); border: 1px solid var(--line); }
.desk .tn-links a { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; color: var(--muted); font-size: 15px; font-weight: 600; font-stretch: 96%; transition: color .15s ease, background .15s ease; }
.desk .tn-links a:hover { color: var(--text); background: rgba(132, 160, 255, .08); }
.desk .tn-links a.on { color: #e6fbff; background: linear-gradient(180deg, rgba(61, 224, 255, .22), rgba(61, 224, 255, .1)); box-shadow: inset 0 0 0 1px rgba(61, 224, 255, .4); }
.desk .tn-links a.on .ic { color: var(--coolant); }
.desk .tn-act { display: flex; align-items: center; gap: 8px; flex: none; }
.desk .tn-act .ibtn { width: 42px; height: 42px; border-radius: 13px; }
.desk .tn-act .ibtn:hover { border-color: var(--line2); color: var(--coolant); }
.desk #tnCta:empty { display: none; }
body.onboarding .topnav, body.onboarding .site-foot { display: none !important; }

/* ---------- page headers ---------- */
.desk .top { min-height: 0; margin-bottom: 28px; }
.desk .ttl { font-size: 40px; }
.desk .kicker { font-size: 15px; margin-bottom: 4px; }
.desk .top.sub { display: flex; justify-content: flex-start; align-items: center; gap: 16px; }
.desk .top.sub .top-t { text-align: left; }
.desk .top.sub .ttl { font-size: 34px; font-stretch: 112%; }
.desk .top > .ibtn.ghost { display: none; }
.desk .top > :last-child:not(:first-child) { margin-left: auto; }
.desk .sec { margin-top: 36px; }
.desk .sec-h { margin-bottom: 14px; }
.desk h2.h2, .desk .h2 { font-size: 21px; }

/* ---------- layout grids ---------- */
.desk .lay { display: grid; gap: 32px; align-items: start; }
.desk .lay-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.desk .lay-home { grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); }
.desk .lay-side { grid-template-columns: 300px minmax(0, 1fr); }
.desk .lay-train { grid-template-columns: 380px minmax(0, 1fr); }
.desk .col > :first-child { margin-top: 0; }
.desk .side { position: sticky; top: 96px; max-height: calc(100vh - 112px); overflow-y: auto; scrollbar-width: thin; padding-right: 4px; }
.desk .narrow { max-width: 760px; margin: 0 auto; }

/* ---------- hover polish (mouse) ---------- */
.desk .rcard:hover, .desk .xcard:hover, .desk .rcard-h:hover, .desk .tile:hover, .desk .bdg:hover { border-color: var(--line2); transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 0, 0, .35); }
.desk .xcard, .desk .rcard-h, .desk .tile, .desk .bdg { transition: transform .18s ease, border-color .2s ease, box-shadow .2s ease; }
.desk .rcard .pimg { transition: opacity .45s ease, transform .5s ease; }
.desk .rcard:hover .pimg.ok { transform: scale(1.045); }
.desk a.row:hover, .desk button.row:hover, .desk .wday:hover, .desk .xrow:hover, .desk .gitem:hover { background: rgba(132, 160, 255, .05); }
.desk a.row, .desk button.row, .desk .wday { border-radius: 12px; padding-left: 8px; padding-right: 8px; }
.desk .btn:hover { filter: brightness(1.08); }
.desk .chip:hover { border-color: rgba(61, 224, 255, .45); }
.desk .ibtn:hover { border-color: var(--line2); }

/* ---------- home ---------- */
.desk .hero { padding: 22px 22px 18px; }
.desk .hero-twin svg.tw { max-width: 250px; }
.desk .vcol { gap: 30px; }
.desk .vital .v { font-size: 34px; }
.desk .today .rows { border: 1px solid var(--line); border-radius: var(--r-xl); padding: 6px 14px; background: linear-gradient(180deg, rgba(25, 37, 98, .42), rgba(11, 18, 52, .55)); }
.desk .today .row:last-child { border-bottom: 0; }
.desk .rscroll, .desk .hscroll { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 18px; overflow: visible; margin: 0; padding: 0; }
.desk .hscroll { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.desk .rscroll .rcard, .desk .rcard-h { width: auto; }
.desk .rscroll.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.desk .tiles { grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 12px; }
.desk .tile { min-height: 104px; padding: 16px 14px; }

/* ---------- body, measurements, progress ---------- */
.desk .xgrid { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
.desk .bhub { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "r n" "a n"; gap: 0 32px; align-items: start; }
.desk .bh-r { grid-area: r; } .desk .bh-n { grid-area: n; } .desk .bh-a { grid-area: a; }
.desk .bh-n > :first-child { margin-top: 0; }
.desk .mlay { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "a f" "t t"; gap: 0 32px; align-items: start; }
.desk .ml-a { grid-area: a; } .desk .ml-f { grid-area: f; } .desk .ml-t { grid-area: t; }
.desk .ml-a > :first-child, .desk .ml-f > :first-child { margin-top: 0; }
.desk .tgrid.wide { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; margin-bottom: 12px; }
.desk .tgrid.wide > .panel { margin: 0; }
.desk .tgrid.wide .xgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.desk .lay-train #exList > :first-child { margin-top: 0; }
.desk .chips.scroll { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.desk .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; overflow: visible; margin: 0 0 22px; padding: 0; }
.desk .day { width: auto; padding: 12px 0; }
.desk .day b { font-size: 16px; }
.desk .pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start; }
.desk .pgrid > section { margin-top: 0; }
.desk .pgrid > section:last-child { grid-column: 1 / -1; }
.desk .mgrid { grid-template-columns: 140px 1fr; gap: 20px; }
.desk .mgrid .mdiag { max-width: 140px; top: 96px; }
.desk .badges { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.desk .stats { gap: 12px; }
.desk .water-panel { border-radius: var(--r-xl); padding: 26px 26px 18px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(25, 37, 98, .5), rgba(11, 18, 52, .62)); }
.desk .qw-rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
.desk .ex-hint { margin: 0; padding: 48px 24px; border: 1px dashed var(--line2); border-radius: 24px; text-align: center; }
.desk .bm-wrap { gap: 10px; }

/* ---------- fuel ---------- */
.desk .seg-tabs { max-width: 560px; }
.desk .rgrid { grid-template-columns: repeat(auto-fill, minmax(188px, 1fr)); gap: 18px; }
.desk .rc-t { padding: 12px 14px 14px; }
.desk .rc-t b { font-size: 15.5px; }
.desk .fplan { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto 1fr; grid-template-areas: "meals tot" "meals side"; gap: 0 36px; align-items: start; }
.desk .fp-tot { grid-area: tot; }
.desk .fp-meals { grid-area: meals; }
.desk .fp-side { grid-area: side; }
.desk .fp-meals > :first-child { margin-top: 0; }
.desk .m-open { grid-template-columns: 112px minmax(0, 1fr); gap: 18px; }
.desk .meal { padding: 12px 0; }
.desk .meal .ftile { width: 112px; height: 84px; border-radius: 16px; }
.desk .meal b { font-size: 17px; margin: 2px 0; }
.desk .gcols { columns: 2; column-gap: 44px; }
.desk .gaisle { break-inside: avoid; }

/* ---------- sheets become centred dialogs ---------- */
.desk .sheet-wrap:not(.full) { align-items: center; padding: 40px 24px; }
.desk .sheet-wrap:not(.full) .sheet { max-width: 640px; max-height: calc(100vh - 80px); border-radius: 28px; border-bottom: 1px solid var(--line2); transform: translateY(18px) scale(.98); opacity: 0; transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .25s ease; box-shadow: 0 30px 90px rgba(0, 0, 0, .6); }
.desk .sheet-wrap.open:not(.full) .sheet { transform: none; opacity: 1; }
.desk .sheet-wrap.wide .sheet { max-width: 1040px; }
.desk .sheet-wrap .grab { display: none; }
.desk .sheet-wrap:not(.full) .sheet-body { padding: 8px 30px 30px; }
.desk .sheet-h { padding-top: 22px; }
.desk .sh-t { font-size: 26px; }
.desk .rs-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.04fr); gap: 36px; align-items: start; }
.desk .rs-a { position: sticky; top: 78px; }
.desk .rs-b > :first-child { margin-top: 0; }
.desk .ex-stage svg.tw { max-width: 420px; margin: 0 auto; }

/* ---------- workout player ---------- */
.desk .sheet-wrap.full .sheet { max-width: none; }
.desk .sheet-wrap.full .sheet-body { padding: 24px 40px 32px; }
.desk .pl-top { width: 100%; max-width: 1120px; margin: 0 auto; }
.desk .pl-main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(340px, .85fr); align-items: center; gap: 56px; width: 100%; max-width: 1120px; margin: 0 auto; }
.desk .pl-stage { min-height: 0; }
.desk .pl-stage .tw { max-width: 560px; }
.desk .pl-name { font-size: 34px; }
.desk .pl-sub { font-size: 16px; }
.desk .pl-clock { width: 168px; height: 168px; }
.desk .pl-clock .ring { width: 100%; height: 100%; }
.desk .pl-clock .t { font-size: 48px; }
.desk .pl-cue { font-size: 16px; max-width: 40ch; }
.desk .done-wrap { max-width: 560px; margin: 0 auto; padding-top: 60px; }

/* ---------- onboarding: split screen ---------- */
.desk .onb-split { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(400px, 500px); gap: 56px; align-items: center; min-height: calc(100vh - 108px); }
.desk .onb { min-height: 0; padding: 30px; border-radius: 30px; border: 1px solid var(--line2); background: linear-gradient(180deg, rgba(25, 37, 98, .62), rgba(11, 18, 52, .78)); box-shadow: 0 30px 80px rgba(0, 0, 0, .42); }
.desk .onb .brand { font-size: 36px; margin-top: 0; }
.desk .onb-foot { margin-top: 22px; }
.oa-in { display: grid; gap: 22px; }
.oa-h { margin: 6px 0 0; font-size: 52px; line-height: 1.04; font-weight: 780; font-stretch: 118%; letter-spacing: -.02em; }

.oa-feats b { display: block; font-weight: 640; }
.oa-feats li > span:last-child span { display: block; color: var(--muted); font-size: 14px; line-height: 1.4; }
.oa-co { display: flex; align-items: center; gap: 16px; padding-top: 20px; border-top: 1px solid var(--line); }

/* ---------- footer ---------- */
.desk .site-foot { margin-top: 24px; border-top: 1px solid var(--line); background: linear-gradient(180deg, rgba(10, 17, 52, .35), rgba(5, 8, 23, .92)); position: relative; z-index: 1; }
.sf-in { max-width: 1280px; margin: 0 auto; padding: 52px 40px 30px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 2fr); gap: 56px; }
.sf-tag { color: var(--muted); font-size: 14.5px; line-height: 1.55; max-width: 42ch; margin: 16px 0 24px; }

.sf-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.sf-cols > div { display: grid; gap: 11px; align-content: start; justify-items: start; }
.sf-cols b { font-size: 12.5px; color: var(--text); letter-spacing: .1em; text-transform: uppercase; font-weight: 680; margin-bottom: 4px; }
.sf-cols a, .sf-cols .link { color: var(--muted); font-size: 14.5px; font-weight: 500; text-align: left; }
.sf-cols a:hover, .sf-cols .link:hover { color: var(--coolant); }
.sf-base { max-width: 1280px; margin: 0 auto; padding: 18px 40px 30px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }

/* ---------- mid-size screens (tablets, small laptops) ---------- */

}

  .desk .tn-in { padding: 0 24px; gap: 14px; }
  .desk .lay { gap: 24px; }
  .desk .lay-side { grid-template-columns: 250px minmax(0, 1fr); }
  .desk .lay-train { grid-template-columns: 290px minmax(0, 1fr); }
  .desk .fplan { grid-template-columns: minmax(0, 1fr) 300px; gap: 0 24px; }
  .desk .m-open { grid-template-columns: 88px minmax(0, 1fr); }
  .desk .meal .ftile { width: 88px; height: 66px; }
  .desk .onb-split { grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); gap: 32px; }
  .desk .oa-h { font-size: 40px; }
  .desk .oa-body { grid-template-columns: 1fr; }
  .desk .oa-twin { display: none; }
  .desk .sf-in { grid-template-columns: 1fr; gap: 32px; padding: 40px 24px 24px; }
  .desk .sf-base { padding: 18px 24px 26px; }
  .desk .gcols { columns: 1; }
  .desk .rs-grid { gap: 24px; }
}
@media (max-width: 959px) {
  .desk #tnCta { display: none; }
  .desk .tn-word { font-size: 20px; }
}

const PHOTO_HOST = 'https://images.unsplash.com/';
const PHOTO_W = { card: [160, 240, 400, 800], hero: [400, 800, 1200] };
function photoSrc(id, w) { const p = PHOTOS[id]; return p ? `${PHOTO_HOST}${p[0]}?auto=format&fit=crop&w=${w}&h=${Math.round(w * 0.75)}&q=70` : ''; }
function photoImg(id, kind, sizes, eager) {
  const p = PHOTOS[id]; if (!p) return '';
  const ws = PHOTO_W[kind] || PHOTO_W.card;
  const base = ws[Math.min(ws.length - 1, kind === 'hero' ? 1 : 2)];
  return `<img class="pimg" src="${photoSrc(id, base)}" srcset="${ws.map((w) => `${photoSrc(id, w)} ${w}w`).join(', ')}" sizes="${sizes}" alt="${esc(p[2])}"${eager ? ' fetchpriority="high"' : ' loading="lazy"'} decoding="async" referrerpolicy="no-referrer" width="${base}" height="${Math.round(base * 0.75)}">`;
}
function photoBy(id) { const p = PHOTOS[id]; return p ? p[1] : ''; }
function photoCredit(id) { const p = PHOTOS[id]; return p ? `<p class="pcredit">Photo: ${esc(p[1])} on <a href="https://unsplash.com/?utm_source=vitalense&amp;utm_medium=referral" target="_blank" rel="noopener">Unsplash</a></p>` : ''; }
function foodGrad(r) { return `linear-gradient(140deg,hsl(${r.hue} 85% 58%),hsl(${(r.hue + 40) % 360} 80% 38%))`; }
function drinkGrad(d) { return `radial-gradient(120% 90% at 50% 100%, ${d.color}55, transparent 70%), linear-gradient(180deg,#16225c,#0b1238)`; }
// Fade photos in once loaded; drop broken ones so the tile underneath shows.
document.addEventListener('load', (e) => { const t = e.target; if (t && t.classList && t.classList.contains('pimg')) t.classList.add('ok'); }, true);
document.addEventListener('error', (e) => { const t = e.target; if (t && t.classList && t.classList.contains('pimg')) t.classList.add('fail'); }, true);

/* =========================================================

   vitality score, body analysis, diet + workout plan engines

const Calc = {
  bmi(h = S.profile.heightCm, w = S.profile.weightKg) { const m = h / 100; return w / (m * m); },
  bmiCat(b, asian = S.profile.asianBmi) {
    if (b < 18.5) return { id: 'under', n: 'Underweight', lvl: 'warn' };
    if (asian) {
      if (b < 23) return { id: 'healthy', n: 'Healthy', lvl: 'good' };
      if (b < 27.5) return { id: 'over', n: 'Overweight', lvl: 'warn' };
      return { id: 'obese', n: 'Obese', lvl: 'bad' };
    }
    if (b < 25) return { id: 'healthy', n: 'Healthy', lvl: 'good' };
    if (b < 30) return { id: 'over', n: 'Overweight', lvl: 'warn' };
    if (b < 35) return { id: 'ob1', n: 'Obese (class I)', lvl: 'bad' };
    if (b < 40) return { id: 'ob2', n: 'Obese (class II)', lvl: 'bad' };
    return { id: 'ob3', n: 'Obese (class III)', lvl: 'bad' };
  },
  bmiZones(asian = S.profile.asianBmi) {
    return asian
      ? [[15, 18.5, 'Underweight', '#7ab8ff'], [18.5, 23, 'Healthy', '#3cf0b4'], [23, 27.5, 'Overweight', '#ffc24a'], [27.5, 40, 'Obese', '#ff4d6d']]
      : [[15, 18.5, 'Underweight', '#7ab8ff'], [18.5, 25, 'Healthy', '#3cf0b4'], [25, 30, 'Overweight', '#ffc24a'], [30, 35, 'Obese I', '#ff7a2f'], [35, 40, 'Obese II+', '#ff4d6d']];
  },
  healthyRange(h = S.profile.heightCm, asian = S.profile.asianBmi) { const m2 = Math.pow(h / 100, 2); return [18.5 * m2, (asian ? 22.9 : 24.9) * m2]; },
  latestM() { return S.measures.length ? S.measures[S.measures.length - 1] : null; },
  whtr(m = Calc.latestM()) { return m && m.waist ? m.waist / S.profile.heightCm : null; },
  whtrCat(r) {
    if (r < 0.4) return { n: 'Very slim', lvl: 'cool' };
    if (r < 0.5) return { n: 'Healthy', lvl: 'good' };
    if (r < 0.6) return { n: 'Increased risk', lvl: 'warn' };
    return { n: 'High risk', lvl: 'bad' };
  },
  whr(m = Calc.latestM()) { return m && m.waist && m.hips ? m.waist / m.hips : null; },
  whrCat(r, sex = S.profile.sex) { const lim = sex === 'male' ? 0.9 : 0.85; return r >= lim ? { n: 'Raised', lvl: 'warn' } : { n: 'Healthy', lvl: 'good' }; },
  bodyFat(m = Calc.latestM()) {
    if (!m) return null;
    if (m.bf) return m.bf;
    const h = S.profile.heightCm, sex = S.profile.sex;
    if (!m.waist || !m.neck) return null;
    let bf;
    if (sex === 'male') { if (m.waist - m.neck <= 0) return null; bf = 495 / (1.0324 - 0.19077 * Math.log10(m.waist - m.neck) + 0.15456 * Math.log10(h)) - 450; }
    else { if (!m.hips || m.waist + m.hips - m.neck <= 0) return null; bf = 495 / (1.29579 - 0.35004 * Math.log10(m.waist + m.hips - m.neck) + 0.221 * Math.log10(h)) - 450; }
    return isFinite(bf) ? clamp(bf, 3, 60) : null;
  },
  bfCat(bf, sex = S.profile.sex) {
    const t = sex === 'male' ? [6, 14, 18, 25] : [14, 21, 25, 32];
    if (bf < t[0]) return { n: 'Essential fat', lvl: 'warn' };
    if (bf < t[1]) return { n: 'Athletic', lvl: 'good' };
    if (bf < t[2]) return { n: 'Fit', lvl: 'good' };
    if (bf < t[3]) return { n: 'Average', lvl: 'warn' };
    return { n: 'High', lvl: 'bad' };
  },
  bmr(p = S.profile) { return 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + (p.sex === 'male' ? 5 : -161); },
  tdee(p = S.profile) { const a = ACTIVITY.find((x) => x.id === p.activity) || ACTIVITY[1]; return Calc.bmr(p) * a.f; },
  waterGoal(p = S.profile) {
    let ml = p.weightKg * 35;
    if (['moderate', 'very', 'athlete'].includes(p.activity)) ml += 500;
    if (p.hot) ml += 500;
    return Math.round(clamp(ml, 1800, 4500) / 50) * 50;
  },
  waterToday() { return S.water[dkey()] || 0; },
  hrMax(age = S.profile.age) { return Math.round(208 - 0.7 * age); },

  /* ---------- bio age ---------- */
  bio(ans) {
    const age = S.profile.age;
    const items = [];
    BIO_Q.forEach((q) => {
      const i = ans[q.id]; if (i == null) return;
      let v = q.o[i][1]; if (v === 'age') v = age >= 50 ? 1.5 : 0.7;
      const best = Math.min(...q.o.map((o) => (o[1] === 'age' ? 9 : o[1])));
      items.push({ id: q.id, n: q.s, v, best });
    });
    const b = Calc.bmi();
    const bv = b < 18.5 ? 1.5 : b < 25 ? -0.5 : b < 27.5 ? 0.5 : b < 30 ? 1 : b < 35 ? 2 : b < 40 ? 3.5 : 5;
    items.push({ id: 'bmi', n: 'BMI', v: bv, best: -0.5 });
    const r = Calc.whtr();
    if (r) items.push({ id: 'waist', n: 'Waist-to-height', v: r < 0.4 ? 0 : r < 0.5 ? -1 : r < 0.55 ? 0.5 : r < 0.6 ? 1.5 : 3, best: -1 });
    const scale = clamp(age / 40, 0.6, 1.25);
    items.forEach((it) => { it.y = rnd(it.v * scale, 1); it.gain = rnd(Math.max(0, it.v - it.best) * scale, 1); });
    const adj = clamp(sum(items.map((i) => i.y)), -10, 15);
    const bio = Math.max(18, age + adj);
    const levers = items.filter((i) => i.gain > 0.2).sort((a, b) => b.gain - a.gain).slice(0, 3);
    return { bio: rnd(bio, 1), age, adj: rnd(adj, 1), items: items.sort((a, b) => b.y - a.y), levers, date: Date.now() };
  },

  /* ---------- vitality score ---------- */
  vitality() {
    const parts = []; const p = S.profile;
    const b = Calc.bmi(); const [lo, hi] = Calc.healthyRange();
    const w = p.weightKg; const dist = w < lo ? (lo - w) / lo : w > hi ? (w - hi) / hi : 0;
    parts.push({ n: 'BMI', v: 25 * clamp(1 - dist * 4, 0, 1), max: 25 });
    if (S.bio) parts.push({ n: 'Bio age', v: clamp(12.5 - (S.bio.bio - S.bio.age) * 2.5, 0, 25), max: 25 });
    const r = Calc.whtr();
    if (r) parts.push({ n: 'Waist', v: r < 0.5 ? 20 : r < 0.6 ? 20 - (r - 0.5) * 140 : clamp(6 - (r - 0.6) * 60, 0, 6), max: 20 });
    const wk = Calc.workoutsSince(7); const want = S.plan ? S.plan.wk.filter((d) => d.type !== 'rest').length : 3;
    parts.push({ n: 'Activity', v: 15 * clamp(wk / Math.max(1, want), 0, 1), max: 15 });
    parts.push({ n: 'Water', v: 15 * clamp(Calc.waterToday() / Calc.waterGoal(), 0, 1), max: 15 });
    const score = Math.round(100 * sum(parts.map((x) => x.v)) / sum(parts.map((x) => x.max)));
    const label = score >= 85 ? 'Excellent' : score >= 70 ? 'Good' : score >= 50 ? 'Fair' : 'Building up';
    return { score, label, parts };
  },
  workoutsSince(days) { const t = Date.now() - days * 864e5; return S.workouts.filter((w) => w.t >= t).length; },
  streak() {
    const set = new Set(S.workouts.map((w) => dkey(new Date(w.t))));
    let d = new Date(); let n = 0;
    if (!set.has(dkey(d))) d.setDate(d.getDate() - 1);
    while (set.has(dkey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  },

  /* ---------- body analysis → focus areas ---------- */
  analyze() {
    const p = S.profile, m = Calc.latestM(), ins = [], why = {};
    const add = (a, t) => { if (!why[a]) why[a] = t; };
    const b = Calc.bmi(), bc = Calc.bmiCat(b);
    const [lo, hi] = Calc.healthyRange();
    if (bc.id === 'healthy') ins.push({ lvl: 'good', t: `BMI ${b.toFixed(1)} is in the healthy range`, d: 'Keep it here while you build strength and fitness.' });
    else if (bc.id === 'under') { ins.push({ lvl: 'warn', t: `BMI ${b.toFixed(1)} is below the healthy range`, d: `A healthy weight for your height starts at ${U.w(lo)}. Focus on strength training and a small calorie surplus.` }); add('legs', 'Big compound lifts add muscle fastest'); add('back', 'Builds posture and upper-body mass'); add('chest', 'Adds upper-body muscle'); }
    else ins.push({ lvl: bc.lvl, t: `BMI ${b.toFixed(1)} — ${bc.n.toLowerCase()}`, d: `Your healthy range is ${U.w(lo, 0)}–${U.w(hi, 0)}. Losing ${U.w(Math.max(0, p.weightKg - hi), 1)} would bring you into it.` });
    if (m && m.waist) {
      const r = m.waist / p.heightCm, c = Calc.whtrCat(r);
      ins.push({ lvl: c.lvl, t: `Waist-to-height ${r.toFixed(2)} — ${c.n.toLowerCase()}`, d: r >= 0.5 ? 'Keep your waist to less than half your height. Central fat is the type most linked to heart and metabolic risk.' : 'Your waist is in a healthy proportion to your height.' });
      if (r >= 0.5) { add('core', `Waist-to-height is ${r.toFixed(2)}; core strength plus your calorie target trims the waist`); add('cardio', 'Cardio burns the deep belly fat linked to health risk'); }
    }
    const wh = Calc.whr(m);
    if (wh) { const c = Calc.whrCat(wh); ins.push({ lvl: c.lvl, t: `Waist-to-hip ${wh.toFixed(2)} — ${c.n.toLowerCase()}`, d: c.lvl === 'good' ? 'Within the WHO healthy range.' : `WHO flags above ${p.sex === 'male' ? '0.90' : '0.85'} as raised risk.` }); if (c.lvl !== 'good') add('core', 'Waist-to-hip ratio is raised'); }
    const bf = Calc.bodyFat(m);
    if (bf) {
      const c = Calc.bfCat(bf);
      ins.push({ lvl: c.lvl, t: `Body fat about ${bf.toFixed(1)}% — ${c.n.toLowerCase()}`, d: (m && m.bf ? 'From your own measurement.' : 'Estimated with the US Navy tape method (±3–4%).') + ` Lean mass is roughly ${U.w(p.weightKg * (1 - bf / 100))}.` });
      if (c.n === 'High' || c.n === 'Average') { add('cardio', 'Higher body fat responds best to cardio plus strength'); add('legs', 'Large leg muscles burn the most energy'); }
    }
    if (m && m.arm && S.prefs && S.prefs.goal === 'gain') { const lim = p.sex === 'male' ? 33 : 28; if (m.arm < lim) add('arms', `Upper arm ${U.len(m.arm)} has room to grow with direct work`); }
    if (m && m.chest && m.waist && S.prefs && ['gain', 'tone'].includes(S.prefs.goal)) { if (m.chest / m.waist < (p.sex === 'male' ? 1.2 : 1.1)) { add('back', 'Wider back and shoulders improve your chest-to-waist taper'); add('shoulders', 'Shoulder width improves your upper-body shape'); } }
    if (S.bio && S.bio.bio - S.bio.age > 2) add('cardio', `Bio age is ${rnd(S.bio.bio - S.bio.age, 1)} years above your real age — cardio fitness is a big lever`);
    (S.focus || []).forEach((a) => { why[a] = why[a] ? why[a] + ' · you chose it' : 'You chose this area'; });
    const order = [...(S.focus || []), ...Object.keys(why)];
    const focus = [...new Set(order)].slice(0, 4);
    return { ins, focus, why };
  },

  /* ---------- nutrition targets ---------- */
  targets(prefs) {
    const p = S.profile, b = Calc.bmi(), tdee = Calc.tdee(), bmr = Calc.bmr();
    const min = p.sex === 'male' ? 1500 : 1200;
    let t = tdee;
    if (prefs.goal === 'lose') { const def = clamp(tdee * (b >= 30 ? 0.25 : 0.2), 300, 750); t = Math.max(tdee - def, min); }
    else if (prefs.goal === 'gain') t = tdee + clamp(tdee * 0.1, 200, 350);
    else if (prefs.goal === 'tone') t = b >= 25 ? tdee - 250 : tdee;
    else t = b >= 25 ? tdee - 300 : b < 18.5 ? tdee + 200 : tdee;
    t = Math.round(Math.max(t, min) / 10) * 10;
    const refW = b > 25 ? 25 * Math.pow(p.heightCm / 100, 2) : p.weightKg;
    const gpk = { lose: 2.0, gain: 1.8, tone: 1.8, health: 1.4 }[prefs.goal] + (prefs.diet === 'highprotein' ? 0.2 : 0);
    let pr = Math.round(Math.min(refW * gpk, (t * 0.35) / 4));
    let fat, carb;
    if (prefs.diet === 'keto') { carb = clamp(Math.round((t * 0.06) / 4), 20, 30); fat = Math.round((t - pr * 4 - carb * 4) / 9); }
    else if (prefs.diet === 'lowcarb') { carb = Math.round((t * 0.25) / 4); fat = Math.round((t - pr * 4 - carb * 4) / 9); }
    else { fat = Math.round((t * (prefs.diet === 'med' ? 0.33 : 0.28)) / 9); carb = Math.round((t - pr * 4 - fat * 9) / 4); }
    if (carb < 0) { carb = 0; fat = Math.round((t - pr * 4) / 9); }
    return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal: t, p: pr, f: fat, c: Math.max(0, carb), fib: Math.round((t / 1000) * 14), water: Calc.waterGoal(), weekly: rnd(((t - tdee) * 7) / 7700, 2) };
  }
};

const Diet = {
  slots(prefs) {
    if (prefs.pattern === 'ramadan') return [{ k: 'suhoor', n: 'Suhoor', type: 'b', pct: 0.35, time: 'Before dawn' }, { k: 'iftar', n: 'Iftar', type: 'd', pct: 0.45, time: 'Sunset', pre: 'Break your fast with 2–3 dates and a glass of water, then pray before your meal.' }, { k: 'snack', n: 'Evening snack', type: 's', pct: 0.2, time: 'After taraweeh' }];
    if (prefs.pattern === 'if168') return [{ k: 'm1', n: 'First meal', type: 'l', pct: 0.4, time: '12:00' }, { k: 's1', n: 'Snack', type: 's', pct: 0.2, time: '16:00' }, { k: 'm2', n: 'Last meal', type: 'd', pct: 0.4, time: '19:30' }];
    if (prefs.meals >= 5) return [{ k: 'b', n: 'Breakfast', type: 'b', pct: 0.25, time: '07:30' }, { k: 's1', n: 'Snack', type: 's', pct: 0.1, time: '10:30' }, { k: 'l', n: 'Lunch', type: 'l', pct: 0.3, time: '13:30' }, { k: 's2', n: 'Snack', type: 's', pct: 0.1, time: '16:30' }, { k: 'd', n: 'Dinner', type: 'd', pct: 0.25, time: '19:30' }];
    if (prefs.meals === 4) return [{ k: 'b', n: 'Breakfast', type: 'b', pct: 0.25, time: '07:30' }, { k: 'l', n: 'Lunch', type: 'l', pct: 0.35, time: '13:00' }, { k: 's1', n: 'Snack', type: 's', pct: 0.1, time: '16:30' }, { k: 'd', n: 'Dinner', type: 'd', pct: 0.3, time: '19:30' }];
    return [{ k: 'b', n: 'Breakfast', type: 'b', pct: 0.3, time: '07:30' }, { k: 'l', n: 'Lunch', type: 'l', pct: 0.35, time: '13:00' }, { k: 'd', n: 'Dinner', type: 'd', pct: 0.35, time: '19:30' }];
  },
  dietOk(r, d) {
    switch (d) { case 'veg': return r.veg; case 'vegan': return r.vegan; case 'pesc': return r.pesc; case 'keto': return r.keto; case 'lowcarb': return r.lc || r.c <= 30; default: return true; }
  },
  pool(type, prefs) {
    const al = prefs.allergies || [], av = prefs.avoid || [];
    for (let relax = 0; relax <= 2; relax++) {
      const base = RECIPES.filter((r) => !r.al.some((a) => al.includes(a)) && (relax >= 2 || !r.tags.some((t) => av.includes(t))) && (relax >= 1 || Diet.dietOk(r, prefs.diet)));
      let p = base.filter((r) => r.m === type);
      if (p.length < 3 && (type === 'l' || type === 'd')) p = p.concat(base.filter((r) => r.m === (type === 'l' ? 'd' : 'l')));
      if (p.length) return { pool: p, relax };
    }
    return { pool: [], relax: 3 };
  },
  score(r, target, used, day, rng, prefs) {
    const portion = clamp(Math.round((target / r.kcal) * 4) / 4, 0.5, 2.5);
    const err = Math.abs(r.kcal * portion - target) / target;
    const last = used[r.id];
    const rep = last == null ? 0 : day - last <= 1 ? 3 : day - last <= 3 ? 0.8 : 0.25;
    const wantP = prefs.goal !== 'health' || prefs.diet === 'highprotein';
    const pB = wantP ? -Math.min((r.p / r.kcal) * 100, 12) * 0.06 : 0;
    const medB = prefs.diet === 'med' && r.tags.includes('med') ? -0.35 : 0;
    const pp = portion > 1.5 ? (portion - 1.5) * 0.9 : portion < 0.75 ? (0.75 - portion) * 0.9 : 0;

  },

  build(prefs, nut, seed) {

  grocery(plan, dayList) {
    const map = new Map();

function fmtQty(q, u, portion = 1) {
  if (!q) return '';
