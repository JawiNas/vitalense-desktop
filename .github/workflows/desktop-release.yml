# Builds the VitaLense installers for Windows and Mac and puts them on a GitHub release.
#
# To release: raise "version" in package.json and push to main. When that version has no
# release yet, the workflow tags it (for example v1.2.1) and, after about 5 minutes, the release has:
#   VitaLense-Setup.exe   Windows installer      (the download page links to this name)
#   VitaLense.dmg         Mac disk image         (the download page links to this name)
#   VitaLense-mac.zip, latest.yml, latest-mac.yml and *.blockmap   used by automatic updates
# Pushing a tag such as v1.2.1 yourself, or publishing a release with a new tag on github.com, works too.
#
# When the version is already released, pushes to main (except README changes) and "Run workflow"
# on the Actions tab only build the installers; download them from the run's summary page to test.
#
# Signing is optional. Without certificates the apps still work, but Windows and Mac
# show a warning the first time (see README.md). Add these repository secrets to sign:
#   WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD                       Windows code-signing certificate
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD                       Apple "Developer ID Application" certificate
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID         Apple notarization (with the Mac certificate)

name: Desktop release

on:
  push:
    tags: ['v*']
    branches: [main]          # built every time; released when package.json has a new version
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CERT: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          # An empty certificate setting breaks the build, so it is only set when the secret exists.
          if [ -n "$WIN_CERT" ]; then
            export CSC_LINK="$WIN_CERT" CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
          else
            echo "::notice::No Windows certificate. Building an unsigned installer (Windows shows a SmartScreen warning)."
          fi
          npx electron-builder --win --publish never

      - name: Build the Mac app
        if: runner.os == 'macOS'
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT" ]; then
            export CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            if [ -n "$NOTARY_APPLE_ID" ]; then
              export APPLE_ID="$NOTARY_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
            else
              echo "::notice::Signed but not notarized. Add the APPLE_* secrets to notarize."
            fi
            npx electron-builder --mac --publish never
          else
            # Ad-hoc signature: Apple Silicon Macs refuse to run an app with no signature at all.
            echo "::notice::No Mac certificate. Building an ad-hoc signed app (first launch needs Open Anyway)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vitalense-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish the release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      # A tag publishes that tag. On main, the version in package.json is published once:
      # raising "version" and pushing to main is all it takes to release.
      - name: Work out the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v$(jq -r .version package.json)"; fi
          if gh release view "$tag" > /dev/null 2>&1; then exists=true; else exists=false; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$exists" = "false" ]; then publish=true; else publish=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = "false" ]; then
            echo "::notice::$tag is already released. Raise \"version\" in package.json to publish a new release."
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: steps.rel.outputs.publish == 'true'
        with:
          path: out
          merge-multiple: true

      - name: Upload the installers
        if: steps.rel.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          ls -la out
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "VitaLense ${TAG#v}" --generate-notes
          fi
